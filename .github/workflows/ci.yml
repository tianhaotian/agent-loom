name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Workspace quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustup default 1.98.0

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit and contract tests
        run: cargo test --workspace

  postgres:
    name: PostgreSQL 16 transactions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_loom
          POSTGRES_PASSWORD: agent_loom
          POSTGRES_DB: agent_loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_loom -d agent_loom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AGENT_LOOM_TEST_POSTGRES_URL: postgresql://agent_loom:agent_loom@localhost:5432/agent_loom_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0

      - name: Run PostgreSQL migration and transaction tests
        run: cargo test -p agent-loom-store-postgres --all-targets -- --test-threads=1
